name: lazarus

on:
  push:
    paths:
      - "plugins/lazarus/**"
      - ".claude-plugin/**"
      - ".agents/**"
      - "AGENTS.md"
      - "README.md"
      - "tests/**"
      - ".github/workflows/lazarus.yml"
  pull_request:
    paths:
      - "plugins/lazarus/**"
      - ".claude-plugin/**"
      - ".agents/**"
      - "AGENTS.md"
      - "README.md"
      - "tests/**"
      - ".github/workflows/lazarus.yml"

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            plugins/lazarus/requirements.txt
            plugins/lazarus/requirements.lock
      - name: Install locked Lazarus dependencies
        run: python3 -m pip install --requirement plugins/lazarus/requirements.lock
      - name: Portable entrypoints and repository contracts
        run: python3 -m unittest discover -s tests -v
      - name: Lazarus test suite
        run: python3 -m unittest discover -s plugins/lazarus/tests -t plugins/lazarus -v
