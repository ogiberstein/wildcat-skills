name: repo

on:
  push:
    paths:
      - "plugins/**"
      - "tests/**"
      - "repo_contract.py"
      - ".claude-plugin/**"
      - ".agents/**"
      - "docs/**"
      - "AGENTS.md"
      - "README.md"
      - ".github/workflows/repo.yml"
  pull_request:
    paths:
      - "plugins/**"
      - "tests/**"
      - "repo_contract.py"
      - ".claude-plugin/**"
      - ".agents/**"
      - "docs/**"
      - "AGENTS.md"
      - "README.md"
      - ".github/workflows/repo.yml"

permissions:
  contents: read

jobs:
  invariants:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Repository-wide invariant suite
        run: python3 -m unittest discover -s tests -v
